name: discover-dsh-plugins

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      coverage:
        description: Percent of the capped star-ranked sample to inspect
        required: true
        default: '10'
        type: choice
        options:
          - '10'
          - '20'
          - '100'
      max-results:
        description: Maximum union of search results before percentile sampling
        required: true
        default: '200'
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: discover-dsh-plugins
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test discovery and registry contracts
        run: npm test
      - name: Discover public candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE: ${{ inputs.coverage || '10' }}
          MAX_RESULTS: ${{ inputs['max-results'] || '200' }}
        run: node scripts/discover-plugins.mjs --coverage "$COVERAGE" --max-results "$MAX_RESULTS"
      - name: Validate formal registry remains unchanged and valid
        run: npm run validate
      - name: Open or refresh the candidate review PR
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/discover-dsh-plugins
        shell: bash
        run: |
          if git diff --quiet -- discovery/candidates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git switch -C "$BRANCH"
          git add discovery/candidates.json
          git commit -m "chore(discovery): refresh DSH plugin candidates"
          git push --force-with-lease origin "HEAD:$BRANCH"
          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -q '^1$'; then
            gh pr edit "$BRANCH" --body-file .github/discovery-pr-body.md
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(discovery): refresh DSH plugin candidates" \
              --body-file .github/discovery-pr-body.md
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch required validation for the automation branch
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run plugin-registry.yml --ref automation/discover-dsh-plugins
